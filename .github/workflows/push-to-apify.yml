name: Label-Triggered Push to Apify

on:
  pull_request:
    types: [labeled]

jobs:
  deploy:
    if: github.event.label.name == 'deploy-to-apify'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required so actions/checkout can fetch the repo
      pull-requests: write # Required so the job can post a comment to your PR

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Push Actor to Apify
        id: apify_push  # Added ID so we can reference its outputs
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          actor-id: nerb1x/wiki-elections-scraper
          build-tag: pr-${{ github.event.pull_request.number }}

      - name: Comment Build Link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const buildId = '${{ steps.apify_push.outputs.build-id }}';
            const buildsUrl = 'https://console.apify.com/actors/lgpxIoadBpSUNQ3ip/builds';

            const message = `🚀 **Apify Build Triggered Successfully!**\n\n` +
                            `• **Tag:** \`pr-${{ github.event.pull_request.number }}\`\n` +
                            `• **Build ID:** \`${buildId}\`\n\n` +
                            `🔗 [View Builds in Apify Console](${buildsUrl})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
